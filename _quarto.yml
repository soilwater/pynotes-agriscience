project:
  type: book
  output-dir: docs

book:
  favicon: favicon.png
  cover-image: cover_v1.png
  repo-url: https://github.com/soilwater/pynotes-agriscience
  repo-actions: [edit]
  #downloads: [pdf]
  title: "PyNotes in Agriscience"
  author: Andres Patrignani
  date-format: "long"
  page-navigation: true
  google-analytics: "G-N9033JNDWZ"
  
  chapters:
    - index.qmd
    - part: "GETTING STARTED"
      chapters:
        - markdown/inspiration.md
        - markdown/reproducible_research.md
        - markdown/coding_guidelines.md
        - markdown/installing_software.md
        - markdown/terminal_commands.md
        - markdown/git_commands.md
        - markdown/my_first_repo.md
        - markdown/markdown_basics.md
        - markdown/latex_equations.md
        - markdown/alt_python_libraries.md
    
    - part: "PYTHON FUNDAMENTALS"
      chapters:
        - basic_concepts/basic_operations.ipynb
        - basic_concepts/import_modules.ipynb
        - basic_concepts/data_types.ipynb
        - basic_concepts/data_structures.ipynb
        - basic_concepts/indexing_and_slicing.ipynb
        - basic_concepts/if_statement.ipynb
        - basic_concepts/for_loop.ipynb
        - basic_concepts/while_loop.ipynb
        - basic_concepts/list_comprehensions.ipynb
        - basic_concepts/functions.ipynb
        - basic_concepts/lambda_functions.ipynb
        - basic_concepts/error_handling.ipynb
        - basic_concepts/dates_and_times.ipynb
        - basic_concepts/directory_navigation.ipynb
        - basic_concepts/numpy_module.ipynb
        - basic_concepts/pandas_module.ipynb
        - basic_concepts/plotting.ipynb
        - basic_concepts/inputs.ipynb
        - basic_concepts/pickle.ipynb
        - basic_concepts/objects_and_classes.ipynb
        - basic_concepts/sql_database.ipynb
        - basic_concepts/widgets.ipynb

    # Exercises are listed in a single part, roughly in order of difficulty.
    # The comments below are only for maintenance and do not appear on the website.
    - part: "EXERCISES"
      chapters:
        # Applying the basics (arithmetic, loops, conditionals, functions)
        - exercises/mass_volume_relationships.ipynb
        - exercises/group_least_variance.ipynb
        - exercises/random_plots.ipynb
        - exercises/central_dogma.ipynb
        - exercises/soil_textural_class.ipynb
        - exercises/mixing_model.ipynb
        - exercises/random_walk.ipynb
        - exercises/weed_population.ipynb

        # Working with real datasets (Pandas and Matplotlib)
        - exercises/meteogram.ipynb
        - exercises/atmospheric_water_deficit.ipynb
        - exercises/first_and_last_frost.ipynb
        - exercises/distribution_daily_precipitation.ipynb
        - exercises/high_resolution_rainfall_events.ipynb
        - exercises/soil_water_storage.ipynb
        - exercises/request_web_data.ipynb

        # Statistics, regression, and curve fitting
        - exercises/anscombe_quartet.ipynb
        - exercises/error_metrics.ipynb
        - exercises/basic_statistical_tests.ipynb
        - exercises/calibration_teros_12.ipynb
        - exercises/neutron_probe_calibration.ipynb
        - exercises/cdf_matching.ipynb
        - exercises/proctor_test.ipynb
        - exercises/optimal_nitrogen_rate.ipynb
        - exercises/maximum_return_to_nitrogen.ipynb
        - exercises/multiple_linear_regression.ipynb
        - exercises/sorghum_yields.ipynb
        - exercises/soil_water_retention_curve.ipynb
        - exercises/crop_growth_logistic.ipynb
        - exercises/frontier_function.ipynb
        - exercises/atmospheric_carbon_dioxide.ipynb
        - exercises/drydowns.ipynb
        - exercises/autoregressive_model.ipynb

        # Environmental and crop models
        - exercises/photoperiod.ipynb
        - exercises/thermal_time.ipynb
        - exercises/curve_number.ipynb
        - exercises/air_temperature_model.ipynb
        - exercises/soil_temperature_model.ipynb
        - exercises/solar_radiation.ipynb
        - exercises/evapotranspiration.ipynb
        - exercises/pedotransfer_saxton_rawls.ipynb
        - exercises/plant_available_water.ipynb
        - exercises/wheat_potential_yield.ipynb
        - exercises/antecedent_precipitation_index.ipynb
        - exercises/soil_water_balance.ipynb
        - exercises/root_depth.ipynb
        - exercises/rainfall_generator.ipynb

        # Numerical methods (differential equations)
        - exercises/newton_law_cooling.ipynb
        - exercises/predator_prey_model.ipynb
        - exercises/green_ampt.ipynb
        - exercises/reaction_diffusion.ipynb

        # Image analysis
        - exercises/canopy_cover.ipynb
        - exercises/count_seeds.ipynb
        - exercises/soil_cracks.ipynb

        # Spatial analysis (requires geopandas, rasterio, and related packages)
        - exercises/field_random_samples.ipynb
        - exercises/soil_moisture_monitoring_stations.ipynb
        - exercises/weather_network_coverage.ipynb
        - exercises/largest_empty_circle.ipynb
        - exercises/raster_files.ipynb
        - exercises/raster_and_vector.ipynb
        - exercises/lakes_kansas.ipynb
        - exercises/yield_monitor_clean.ipynb
        - exercises/yield_monitor_zones.ipynb
        - exercises/inverse_distance_weighting.ipynb
        - exercises/builtin_spatial_interpolators.ipynb
        - exercises/semivariogram.ipynb
        - exercises/simple_kriging.ipynb

        # Machine learning
        - exercises/clustering_time_series.ipynb
        - exercises/clustering_kansas_environments.ipynb
        - exercises/ml_supervised_classification.ipynb
        - exercises/ml_supervised_regression.ipynb

        # Not listed yet (need polishing): calibration_soil_moisture_sensor,
        # exponential_filter, leaky_bucket, ml_vapor_pressure

  page-footer:
    center: 
      - text: "Material available for free under the Creative Commons Attribution-NonCommercial-ShareAlike (CC BY-NC-SA) license"

format:
  html:
    theme: cosmo
    css: styles.css
    number-sections: true
    number-depth: 1
    code-overflow: scroll
    code-fold: false
    html-math-method: katex
    highlight-style: dracula
    toc: true
    
  #pdf: default



